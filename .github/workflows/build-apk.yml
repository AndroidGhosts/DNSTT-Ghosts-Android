name: Build DNSTT Ghosts ARM64 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate and extract uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*arm64*source*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No source ZIP was found in the repository root."
            exit 1
          fi
          echo "Using source archive: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::No gradlew file found inside the uploaded ZIP."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW" "$PROJECT_DIR/build-debug-apk.sh"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Patch ARM64 verification task for Kotlin DSL compatibility
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if "import java.util.zip.ZipFile" not in s:
              s = "import java.util.zip.ZipFile\n" + s
          s = s.replace("java.util.zip.ZipFile(aar)", "ZipFile(aar)")
          s = s.replace("entry.size()", "entry.size")
          p.write_text(s)
          PY
          grep -n -A12 'verifyGhostcoreArm64' app/build.gradle.kts

      - name: Apply compact phone layout globally
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/res/layout/activity_main.xml")
          s = p.read_text(encoding="utf-8")
          original = s

          # Compact the whole home screen, not just the connect button.
          # Keep small touch targets intact; shrink oversized dp dimensions,
          # spacing and text sizes throughout this layout.
          def compact_dp(m):
              value = float(m.group(1))
              if value < 20:
                  return m.group(0)
              scaled = max(16, round(value * 0.76))
              return f'{scaled}dp'

          def compact_sp(m):
              value = float(m.group(1))
              if value <= 14:
                  return m.group(0)
              scaled = max(12, round(value * 0.86, 1))
              rendered = str(int(scaled)) if scaled.is_integer() else str(scaled)
              return f'{rendered}sp'

          # Scale all explicit dp/sp literals, including widths, heights,
          # margins, padding, textSize, icon sizes and chart dimensions.
          s = re.sub(r'(?<![A-Za-z0-9_.-])(\d+(?:\.\d+)?)dp\b', compact_dp, s)
          s = re.sub(r'(?<![A-Za-z0-9_.-])(\d+(?:\.\d+)?)sp\b', compact_sp, s)

          # Ensure the primary connect control is compact regardless of its
          # original value or attribute order.
          pattern = re.compile(r'<[A-Za-z][^>]*@\+id/connectButton[^>]*>', re.DOTALL)
          match = pattern.search(s)
          if not match:
              raise SystemExit("Could not find connectButton in activity_main.xml")
          tag = match.group(0)
          tag = re.sub(r'android:layout_width="[^"]+"', 'android:layout_width="116dp"', tag, count=1)
          tag = re.sub(r'android:layout_height="[^"]+"', 'android:layout_height="116dp"', tag, count=1)
          s = s[:match.start()] + tag + s[match.end():]

          required = ("@+id/toolbar", "@+id/telegramLink", "@+id/connectButton",
                      "@+id/connectText", "@+id/statusText", "@+id/profileText",
                      "@+id/statsGrid", "@+id/trafficChart", "@+id/chartSummary",
                      "@+id/chartWindowButton", "@+id/profileList", "@+id/testButton",
                      "@+id/fab", "@+id/emptyText")
          missing = [view_id for view_id in required if view_id not in s]
          if missing:
              raise SystemExit("Missing required Activity view IDs: " + ", ".join(missing))
          if s == original:
              raise SystemExit("Layout compaction made no changes")

          p.write_text(s, encoding="utf-8")
          print("Applied global compact layout: dp >= 20 scaled to 76%, sp > 14 scaled to 86%.")
          print("Connect control enforced at 116dp x 116dp.")
          PY

      - name: Build and stage ARM64 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./build-debug-apk.sh

      - name: Verify APK artifact
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="dist/DNSTT-Ghosts-arm64-v8a-debug.apk"
          test -s "$APK"
          echo "APK ready: $APK"
          ls -lh "$APK"
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | grep -E '^(package:|native-code:)'
          fi

      - name: Upload APK only (source ZIP is a separate file)
        uses: actions/upload-artifact@v4
        with:
          name: DNSTT-Ghosts-arm64-v8a-APK
          path: ${{ env.PROJECT_DIR }}/dist/DNSTT-Ghosts-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
