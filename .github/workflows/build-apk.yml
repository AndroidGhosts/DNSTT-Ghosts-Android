name: Build DNSTT Ghosts ARM64 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate and extract uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*arm64*source*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No source ZIP was found in the repository root."
            exit 1
          fi
          echo "Using source archive: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::No gradlew file found inside the uploaded ZIP."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW" "$PROJECT_DIR/build-debug-apk.sh"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Patch ARM64 verification task for Kotlin DSL compatibility
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if "import java.util.zip.ZipFile" not in s:
              s = "import java.util.zip.ZipFile\n" + s
          s = s.replace("java.util.zip.ZipFile(aar)", "ZipFile(aar)")
          s = s.replace("entry.size()", "entry.size")
          p.write_text(s)
          PY
          grep -n -A12 'verifyGhostcoreArm64' app/build.gradle.kts

      - name: Restore original control sizes and avoid forced compact layout
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/res/layout/activity_main.xml")
          s = p.read_text()
          # Remove only the extra heading injected by the previous workflow patch.
          s = s.replace('''                        <TextView
                            android:layout_width="wrap_content" android:layout_height="wrap_content"
                            android:text="TUNNEL CONTROL" android:textColor="@color/text_secondary"
                            android:textSize="10sp" android:letterSpacing="0.16" android:textStyle="bold"
                            android:layout_marginBottom="2dp" />
''', '')
          # Restore the source layout's intended dimensions where the old patch changed them.
          s = s.replace('android:layout_width="92dp" android:layout_height="92dp"',
                        'android:layout_width="112dp" android:layout_height="112dp"')
          s = s.replace('android:layout_width="32dp" android:layout_height="32dp"',
                        'android:layout_width="40dp" android:layout_height="40dp"')
          s = s.replace('android:layout_height="66dp"', 'android:layout_height="88dp"')
          s = s.replace('android:layout_gravity="bottom|end" android:layout_margin="16dp"',
                        'android:layout_gravity="bottom|end" android:layout_margin="20dp"')
          # Do not force a custom compact toolbar or oversized bottom padding; let the
          # original layout and Android's available window dimensions determine sizing.
          s = s.replace('android:layout_height="52dp"\\n        android:background="@color/bg" app:title="@string/app_name"\\n        app:titleTextColor="@color/accent" app:subtitle="GHOSTS NETWORK • ARM64"\\n        app:subtitleTextColor="@color/text_secondary" />',
                        'android:layout_height="?attr/actionBarSize"\\n        android:background="@color/primary_dark"\\n        app:title="@string/app_name" />')
          s = s.replace('android:paddingHorizontal="14dp" android:paddingTop="4dp" android:paddingBottom="88dp"',
                        'android:paddingHorizontal="12dp" android:paddingTop="10dp" android:paddingBottom="16dp"')
          p.write_text(s)
          assert 'android:id="@+id/connectButton"' in s
          assert 'android:id="@+id/profileList"' in s
          print("Restored original control dimensions and removed injected compact heading.")
          PY

      - name: Build and stage ARM64 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./build-debug-apk.sh

      - name: Verify APK artifact
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="dist/DNSTT-Ghosts-arm64-v8a-debug.apk"
          test -s "$APK"
          echo "APK ready: $APK"
          ls -lh "$APK"
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | grep -E '^(package:|native-code:)'
          fi

      - name: Upload APK only (source ZIP is a separate file)
        uses: actions/upload-artifact@v4
        with:
          name: DNSTT-Ghosts-arm64-v8a-APK
          path: ${{ env.PROJECT_DIR }}/dist/DNSTT-Ghosts-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
