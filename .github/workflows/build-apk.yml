name: Build DNSTT Ghosts ARM64 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate and extract uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*arm64*source*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No source ZIP was found in the repository root."
            exit 1
          fi
          echo "Using source archive: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::No gradlew file found inside the uploaded ZIP."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW" "$PROJECT_DIR/build-debug-apk.sh"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Patch ARM64 verification task for Kotlin DSL compatibility
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if "import java.util.zip.ZipFile" not in s:
              s = "import java.util.zip.ZipFile\n" + s
          s = s.replace("java.util.zip.ZipFile(aar)", "ZipFile(aar)")
          s = s.replace("entry.size()", "entry.size")
          p.write_text(s)
          PY
          grep -n -A12 'verifyGhostcoreArm64' app/build.gradle.kts

      - name: Apply responsive phone layout safely
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/res/layout/activity_main.xml")
          s = p.read_text(encoding="utf-8")

          # Patch the actual connect-button tag regardless of attribute order/line breaks.
          pattern = re.compile(r'<[A-Za-z][^>]*@\+id/connectButton[^>]*>', re.DOTALL)
          match = pattern.search(s)
          if not match:
              raise SystemExit("Could not find the connectButton XML tag in activity_main.xml")
          tag = match.group(0)
          tag = re.sub(r'android:layout_width="[^"]+"', 'android:layout_width="132dp"', tag, count=1)
          tag = re.sub(r'android:layout_height="[^"]+"', 'android:layout_height="132dp"', tag, count=1)
          if 'android:layout_width="132dp"' not in tag or 'android:layout_height="132dp"' not in tag:
              raise SystemExit("Could not set connectButton to 132dp x 132dp")
          s = s[:match.start()] + tag + s[match.end():]

          # Increase common compact icon sizes only, without globally changing all padding.
          for old, new in (
              ('android:layout_width="32dp" android:layout_height="32dp"',
               'android:layout_width="52dp" android:layout_height="52dp"'),
              ('android:layout_width="40dp" android:layout_height="40dp"',
               'android:layout_width="52dp" android:layout_height="52dp"'),
          ):
              s = s.replace(old, new)

          s = s.replace('android:layout_height="52dp"', 'android:layout_height="?attr/actionBarSize"')
          s = s.replace('app:cardCornerRadius="16dp"', 'app:cardCornerRadius="20dp"')
          s = s.replace('android:layout_gravity="bottom|end" android:layout_margin="16dp"',
                        'android:layout_gravity="bottom|end" android:layout_margin="20dp"')

          s = re.sub(
              r'\s*<TextView\b(?=[^>]*android:text="TUNNEL CONTROL")[^>]*/>\s*',
              '\\n', s, count=1
          )

          required = ("@+id/toolbar", "@+id/telegramLink", "@+id/connectButton",
                      "@+id/connectText", "@+id/statusText", "@+id/profileText",
                      "@+id/statsGrid", "@+id/trafficChart", "@+id/chartSummary",
                      "@+id/chartWindowButton", "@+id/profileList", "@+id/testButton",
                      "@+id/fab", "@+id/emptyText")
          missing = [view_id for view_id in required if view_id not in s]
          if missing:
              raise SystemExit("Missing required Activity view IDs: " + ", ".join(missing))

          p.write_text(s, encoding="utf-8")
          print("Verified phone connect button size: 132dp x 132dp")
          PY

      - name: Build and stage ARM64 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./build-debug-apk.sh

      - name: Verify APK artifact
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="dist/DNSTT-Ghosts-arm64-v8a-debug.apk"
          test -s "$APK"
          echo "APK ready: $APK"
          ls -lh "$APK"
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | grep -E '^(package:|native-code:)'
          fi

      - name: Upload APK only (source ZIP is a separate file)
        uses: actions/upload-artifact@v4
        with:
          name: DNSTT-Ghosts-arm64-v8a-APK
          path: ${{ env.PROJECT_DIR }}/dist/DNSTT-Ghosts-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
