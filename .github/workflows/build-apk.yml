name: Build DNSTT Ghosts APK (ARM64)

on:
  push:
    branches: [main, openvpn-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch and verify pinned OpenVPN engine
        shell: bash
        run: |
          set -euo pipefail
          OPENVPN_REPO="${GITHUB_WORKSPACE}/openvpn_dart"
          git clone --no-checkout https://github.com/mysteriumnetwork/openvpn_dart.git "$OPENVPN_REPO"
          git -C "$OPENVPN_REPO" checkout --detach 260c4445c4180af04f9a8bf2752d485b0b113a63
          test "$(git -C "$OPENVPN_REPO" rev-parse HEAD)" = "260c4445c4180af04f9a8bf2752d485b0b113a63"
          AAR="$OPENVPN_REPO/android/localmaven/network/mysterium/openvpn/icsopenvpn/0.7.55-myst/icsopenvpn-0.7.55-myst.aar"
          test -s "$AAR"
          echo "3540c8579b0056baac517cb6c930d9d9fb19cbbdf6216e4353fce5513aee50f6  $AAR" | sha256sum --check -
          echo "Pinned OpenVPN engine verified against provenance SHA-256."

      - name: Locate and extract uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*arm64*source*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No source ZIP was found in the repository root."
            exit 1
          fi
          echo "Using source archive: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::No gradlew file found inside the uploaded ZIP."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW" "$PROJECT_DIR/build-debug-apk.sh"

      - name: Apply unified DNS settings and configure ARM64 output
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/patches/apply_dns_unified.py"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path("app/src/main/res").glob("values*/strings.xml"):
              ET.parse(p)
          print("All Android string XML files parse successfully.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Patch ARM64 verification task for Kotlin DSL compatibility
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if "import java.util.zip.ZipFile" not in s:
              s = "import java.util.zip.ZipFile\n" + s
          s = s.replace("java.util.zip.ZipFile(aar)", "ZipFile(aar)")
          s = s.replace("entry.size()", "entry.size")
          p.write_text(s)
          PY
          grep -n -A12 'verifyGhostcoreArm64' app/build.gradle.kts

      - name: Extend app behind status bar and camera cutout
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("app/src/main/java"), Path("app/src/main/kotlin")]
          files = [p for root in roots if root.exists() for p in root.rglob("*Activity.kt")]
          files += [p for root in roots if root.exists() for p in root.rglob("*Activity.java")]
          if not files:
              raise SystemExit("No Activity source file found; cannot safely apply edge-to-edge mode.")
          files.sort(key=lambda p: (0 if "MainActivity" in p.name else 1, str(p)))
          p = files[0]
          s = p.read_text(encoding="utf-8")
          marker = "GHOSTS_EDGE_TO_EDGE_STATUS_BAR"
          if marker in s:
              print(f"Edge-to-edge mode already configured in {p}")
              raise SystemExit(0)

          kt = """
                  // GHOSTS_EDGE_TO_EDGE_STATUS_BAR: draw behind status bar and into the display cutout area.
                  if (android.os.Build.VERSION.SDK_INT >= 28) {
                      val lp = window.attributes
                      lp.layoutInDisplayCutoutMode = android.view.WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      window.attributes = lp
                  }
                  window.statusBarColor = android.graphics.Color.TRANSPARENT
                  window.navigationBarColor = android.graphics.Color.TRANSPARENT
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility = (
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  )
          """
          java = """
                  // GHOSTS_EDGE_TO_EDGE_STATUS_BAR: draw behind status bar and into the display cutout area.
                  if (android.os.Build.VERSION.SDK_INT >= 28) {
                      android.view.WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = android.view.WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  getWindow().setStatusBarColor(android.graphics.Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(android.graphics.Color.TRANSPARENT);
                  getWindow().getDecorView().setSystemUiVisibility(
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  );
          """
          pattern = r'super\.onCreate\(savedInstanceState\)'
          block = kt if p.suffix == ".kt" else java
          updated, n = re.subn(pattern, lambda m: m.group(0) + block, s, count=1)
          if n != 1:
              raise SystemExit(f"Could not find onCreate(savedInstanceState) in {p}; no source changed.")
          p.write_text(updated, encoding="utf-8")
          print(f"Enabled edge-to-edge status bar/cutout layout in {p}")
          PY

      - name: Apply adaptive accessible phone layout to all screens
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          layout_dir = Path("app/src/main/res/layout")
          if not layout_dir.exists():
              raise SystemExit("Layout directory not found.")

          for p in layout_dir.glob("*.xml"):
              s = p.read_text(encoding="utf-8")
              original = s

              # 1. إضافة fitsSystemWindows="true" للعنصر الجذري في جميع الشاشات لمنع تداخل المحتوى مع أشرطة النظام
              root_match = re.search(r'(<[a-zA-Z0-9.]+\b[^>]*)>', s)
              if root_match:
                  root_tag = root_match.group(1)
                  if 'android:fitsSystemWindows' not in root_tag:
                      new_root_tag = root_tag + ' android:fitsSystemWindows="true"'
                      s = s.replace(root_tag, new_root_tag, 1)

              # 2. تعديلات خاصة بالشاشة الرئيسية فقط (activity_main.xml)
              if p.name == "activity_main.xml" and "GHOSTS_ADAPTIVE_PHONE_LAYOUT_APPLIED" not in s:
                  def compact_large_dp(m):
                      value = float(m.group(1))
                      if value < 40:
                          return m.group(0)
                      return f'{max(32, round(value * 0.88))}dp'

                  s = re.sub(r'(?<![A-Za-z0-9_.-])(\d+(?:\.\d+)?)dp\b', compact_large_dp, s)

                  pattern = re.compile(r'<[A-Za-z][^>]*@\+id/connectButton[^>]*>', re.DOTALL)
                  match = pattern.search(s)
                  if not match:
                      raise SystemExit("Could not find connectButton in activity_main.xml")
                  tag = match.group(0)
                  tag = re.sub(r'android:layout_width="[^"]+"', 'android:layout_width="116dp"', tag, count=1)
                  tag = re.sub(r'android:layout_height="[^"]+"', 'android:layout_height="116dp"', tag, count=1)
                  s = s[:match.start()] + tag + s[match.end():]

                  clickable = re.compile(r'<([A-Za-z][\w.]*)\b([^>]*android:(?:clickable|onClick)="[^"]+"[^>]*)>', re.DOTALL)
                  def accessible_target(m):
                      tag_name, attrs = m.group(1), m.group(2)
                      self_closing = attrs.rstrip().endswith("/")
                      if self_closing:
                          attrs = attrs.rstrip()[:-1].rstrip()
                      if 'android:minHeight=' not in attrs:
                          attrs += ' android:minHeight="48dp"'
                      if 'android:minWidth=' not in attrs and tag_name.split('.')[-1] in {
                          'ImageButton', 'Button', 'MaterialButton'
                      }:
                          attrs += ' android:minWidth="48dp"'
                      return f'<{tag_name}{attrs}{" /" if self_closing else ""}>'
                  s = clickable.sub(accessible_target, s)

                  title_pattern = re.compile(r'<([A-Za-z][\w.]*)\b([^>]*(?:Android_Ghosts[.]DNSTT|Android_Ghosts)[^>]*)>', re.DOTALL)
                  def readable_title(m):
                      tag_name, attrs = m.group(1), m.group(2)
                      self_closing = attrs.rstrip().endswith("/")
                      if self_closing:
                          attrs = attrs.rstrip()[:-1].rstrip()
                      if 'android:textSize=' in attrs:
                          attrs = re.sub(r'android:textSize="[^"]+"', 'android:textSize="18sp"', attrs, count=1)
                      else:
                          attrs += ' android:textSize="18sp"'
                      if 'android:maxLines=' not in attrs:
                          attrs += ' android:maxLines="1"'
                      if 'android:ellipsize=' not in attrs:
                          attrs += ' android:ellipsize="end"'
                      return f'<{tag_name}{attrs}{" /" if self_closing else ""}>'
                  s = title_pattern.sub(readable_title, s)

                  required = ("@+id/toolbar", "@+id/telegramLink", "@+id/connectButton",
                              "@+id/connectText", "@+id/statusText", "@+id/profileText",
                              "@+id/statsGrid", "@+id/trafficChart", "@+id/chartSummary",
                              "@+id/chartWindowButton", "@+id/profileList", "@+id/testButton",
                              "@+id/fab", "@+id/emptyText")
                  missing = [view_id for view_id in required if view_id not in s]
                  if missing:
                      raise SystemExit("Missing required Activity view IDs: " + ", ".join(missing))

              if s != original:
                  p.write_text(s, encoding="utf-8")
                  print(f"Updated layout file: {p.name}")

          print("Successfully applied fitsSystemWindows to all layout screens and adaptive layout to main activity.")
          PY

      - name: Apply Android_Ghosts professional native home screen
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -s "${GITHUB_WORKSPACE}/patches/activity_main.xml"
          test -d "app/src/main/res/layout"
          cp "${GITHUB_WORKSPACE}/patches/activity_main.xml" "app/src/main/res/layout/activity_main.xml"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("app/src/main/res/layout/activity_main.xml")
          root = ET.parse(p).getroot()
          ids = {node.attrib.get("{http://schemas.android.com/apk/res/android}id", "") for node in root.iter()}
          required = {
              "@+id/toolbar", "@+id/telegramLink", "@+id/connectButton",
              "@+id/connectText", "@+id/statusText", "@+id/profileText",
              "@+id/statsGrid", "@+id/trafficChart", "@+id/chartSummary",
              "@+id/chartWindowButton", "@+id/profileList", "@+id/testButton",
              "@+id/fab", "@+id/emptyText"
          }
          missing = sorted(required - ids)
          if missing:
              raise SystemExit("Missing Activity view IDs: " + ", ".join(missing))
          print(f"Professional native layout XML validated; {len(required)} required view IDs preserved.")
          PY

      - name: Install animated Matrix rain background
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          DEST="app/src/main/java/com/androidghosts/dnsttghosts"
          mkdir -p "$DEST"
          cp "${GITHUB_WORKSPACE}/patches/MatrixRainView.kt" "$DEST/MatrixRainView.kt"
          grep -q 'class MatrixRainView' "$DEST/MatrixRainView.kt"
          grep -q 'matrixRainBackground' app/src/main/res/layout/activity_main.xml
          echo "Animated Matrix rain background installed."

      - name: Apply cyber terminal diagnostics screen and redact credentials
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          cp "${GITHUB_WORKSPACE}/patches/LogActivity.kt" app/src/main/java/com/androidghosts/dnsttghosts/LogActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/androidghosts/dnsttghosts/App.kt")
          s = p.read_text(encoding="utf-8")
          old = '        val clean = line.trim().ifEmpty { return }'
          new = '''        val clean = line.trim()
              .replace(Regex("(?i)(sshUser|username|password|sshPass|sshKeyPass|privateKey|token)=([^\\\\s]+)")) {
                  "${it.groupValues[1]}=[REDACTED]"
              }
              .ifEmpty { return }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'private fun redact' not in s and 'val clean = line.trim()' not in s:
              raise SystemExit("Could not safely locate LogBuffer input sanitation point in App.kt")
          if "fun android.content.Context.toast(" not in s:
              s += """

          fun android.content.Context.toast(message: CharSequence) {
              android.widget.Toast.makeText(this, message, android.widget.Toast.LENGTH_SHORT).show()
          }

          fun android.content.Context.clipboard(): android.content.ClipboardManager =
              getSystemService(android.content.Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager
          """
          # Redact SSH usernames emitted in prose as well as key=value credential fields.
          if "logged\\\\s+in\\\\s+as" not in s:
              s = s.replace(
                  '.ifEmpty { return }',
                  '''.replace(Regex("(?i)(ssh\\\\\\\\s+logged\\\\\\\\s+in\\\\\\\\s+as\\\\\\\\s+)\\\\\\\\S+")) {
                      it.groupValues[1] + "[REDACTED]"
                  }
                  .ifEmpty { return }''',
                  1
              )
          p.write_text(s, encoding="utf-8")
          print("Diagnostics screen installed; credential fields are redacted and missing Context helpers are supplied.")
          PY
          grep -n -A5 'val clean = line.trim' app/src/main/java/com/androidghosts/dnsttghosts/App.kt

      - name: Complete Arabic home-screen localization
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path("app/src/main/res/values-ar/strings.xml")
          if not p.exists():
              raise SystemExit("Arabic resources file not found: values-ar/strings.xml")
          tree = ET.parse(p)
          root = tree.getroot()
          additions = {
              "brand_subtitle": "نفق DNSTT • OpenVPN",
              "brand_note": "نفقان فقط: DNSTT وOpenVPN · Android_Ghosts",
          }
          existing = {node.attrib.get("name") for node in root.findall("string")}
          changed = False
          for name, value in additions.items():
              if name not in existing:
                  node = ET.SubElement(root, "string", {"name": name})
                  node.text = value
                  changed = True
          if changed:
              tree.write(p, encoding="utf-8", xml_declaration=True)
          print("Arabic brand labels verified; missing translations were added without replacing existing strings.")
          PY

      - name: Apply OpenVPN profile manager
        shell: bash
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/patches/apply_openvpn.py" "$PROJECT_DIR" "${GITHUB_WORKSPACE}/patches"

      - name: Preflight Android resources and custom views
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          res = Path("app/src/main/res")
          layout = res / "layout/activity_main.xml"
          root = ET.parse(layout).getroot()
          strings = set()
          for p in res.glob("values*/strings.xml"):
              try:
                  strings.update(n.attrib["name"] for n in ET.parse(p).getroot().findall("string"))
              except (ET.ParseError, KeyError) as e:
                  raise SystemExit(f"Invalid string resource file {p}: {e}")

          text = layout.read_text(encoding="utf-8")
          missing_strings = sorted(set(re.findall(r"@string/([A-Za-z0-9_]+)", text)) - strings)
          if missing_strings:
              raise SystemExit("Missing string resources: " + ", ".join(missing_strings))

          # Collect app-owned resources from values XML and drawable/mipmap file names.
          available = {"color": set(), "drawable": set(), "mipmap": set()}
          for p in res.glob("values*/*.xml"):
              try:
                  for node in ET.parse(p).getroot().iter():
                      name = node.attrib.get("name")
                      if node.tag == "color" and name:
                          available["color"].add(name)
              except ET.ParseError:
                  pass
          for kind in ("drawable", "mipmap"):
              for p in res.glob(f"{kind}*/*"):
                  if p.is_file():
                      available[kind].add(p.stem)
          for kind in ("color", "drawable", "mipmap"):
              refs = set(re.findall(rf"@{kind}/([A-Za-z0-9_]+)", text))
              missing = sorted(refs - available[kind])
              if missing:
                  raise SystemExit(f"Missing @{kind} resources: " + ", ".join(missing))

          custom_views = [n.tag for n in root.iter() if "." in n.tag and not n.tag.startswith(("androidx.", "com.google.android.material."))]
          for view in custom_views:
              if view.startswith("com.androidghosts.dnsttghosts."):
                  class_name = view.rsplit(".", 1)[-1]
                  source_roots = [Path("app/src/main/java"), Path("app/src/main/kotlin")]
                  if not any(r.exists() and any(p.name == f"{class_name}.kt" or p.name == f"{class_name}.java" for p in r.rglob("*")) for r in source_roots):
                      raise SystemExit(f"Custom view class source not found: {view}")

          required = {"toolbar", "telegramLink", "connectButton", "connectText", "statusText",
                      "profileText", "statsGrid", "trafficChart", "chartSummary",
                      "chartWindowButton", "profileList", "testButton", "fab", "emptyText"}
          ids = {v.attrib.get("{http://schemas.android.com/apk/res/android}id", "").split("/")[-1]
                 for v in root.iter()}
          missing_ids = sorted(required - ids)
          if missing_ids:
              raise SystemExit("Missing Activity view IDs: " + ", ".join(missing_ids))
          print(f"Preflight passed: XML, {len(strings)} localized string names, custom view sources, and {len(required)} Activity IDs.")
          PY

      - name: Set release version for the new ARM64 APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          if "versionCode = 12" not in s or 'versionName = "1.4.8-arm64"' not in s:
              raise SystemExit("Expected base version 1.4.8-arm64 (code 12) was not found.")
          s = s.replace("versionCode = 12", "versionCode = 13", 1)
          s = s.replace('versionName = "1.4.8-arm64"', 'versionName = "1.4.9-arm64"', 1)
          p.write_text(s, encoding="utf-8")
          print("Configured app version 1.4.9-arm64 (versionCode 13).")
          PY

      - name: Build ARM64 APK for Samsung Galaxy A56
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace verifyGhostcoreArm64 assembleDebug
          mkdir -p dist
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-arm64-v8a-debug.apk
          test -s dist/app-arm64-v8a-debug.apk
          ls -lh dist/app-arm64-v8a-debug.apk

      - name: Verify ARM64 APK artifact
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          for apk in dist/*.apk; do
            test -s "$apk"
            echo "APK ready: $apk"
            ls -lh "$apk"
            if command -v aapt >/dev/null 2>&1; then
              aapt dump badging "$apk" | grep -E '^(package:|native-code:)' || true
            fi
          done
          test -s dist/app-arm64-v8a-debug.apk
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: DNSTT-Ghosts-ARM64-APK
          path: ${{ env.PROJECT_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 14
