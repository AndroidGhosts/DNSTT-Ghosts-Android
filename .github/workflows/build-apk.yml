name: Build DNSTT Ghosts ARM64 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate and extract uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*arm64*source*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No source ZIP was found in the repository root."
            exit 1
          fi
          echo "Using source archive: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::No gradlew file found inside the uploaded ZIP."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW" "$PROJECT_DIR/build-debug-apk.sh"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Patch ARM64 verification task for Kotlin DSL compatibility
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if "import java.util.zip.ZipFile" not in s:
              s = "import java.util.zip.ZipFile\n" + s
          s = s.replace("java.util.zip.ZipFile(aar)", "ZipFile(aar)")
          s = s.replace("entry.size()", "entry.size")
          p.write_text(s)
          PY
          grep -n -A12 'verifyGhostcoreArm64' app/build.gradle.kts

      - name: Extend app behind status bar and camera cutout
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("app/src/main/java"), Path("app/src/main/kotlin")]
          files = [p for root in roots if root.exists() for p in root.rglob("*Activity.kt")]
          files += [p for root in roots if root.exists() for p in root.rglob("*Activity.java")]
          if not files:
              raise SystemExit("No Activity source file found; cannot safely apply edge-to-edge mode.")
          files.sort(key=lambda p: (0 if "MainActivity" in p.name else 1, str(p)))
          p = files[0]
          s = p.read_text(encoding="utf-8")
          marker = "GHOSTS_EDGE_TO_EDGE_STATUS_BAR"
          if marker in s:
              print(f"Edge-to-edge mode already configured in {p}")
              raise SystemExit(0)

          kt = """
                  // GHOSTS_EDGE_TO_EDGE_STATUS_BAR: draw behind status bar and into the display cutout area.
                  if (android.os.Build.VERSION.SDK_INT >= 28) {
                      val lp = window.attributes
                      lp.layoutInDisplayCutoutMode = android.view.WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      window.attributes = lp
                  }
                  window.statusBarColor = android.graphics.Color.TRANSPARENT
                  window.navigationBarColor = android.graphics.Color.TRANSPARENT
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility = (
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  )
          """
          java = """
                  // GHOSTS_EDGE_TO_EDGE_STATUS_BAR: draw behind status bar and into the display cutout area.
                  if (android.os.Build.VERSION.SDK_INT >= 28) {
                      android.view.WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = android.view.WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  getWindow().setStatusBarColor(android.graphics.Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(android.graphics.Color.TRANSPARENT);
                  getWindow().getDecorView().setSystemUiVisibility(
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  );
          """
          pattern = r'super\.onCreate\(savedInstanceState\)'
          block = kt if p.suffix == ".kt" else java
          updated, n = re.subn(pattern, lambda m: m.group(0) + block, s, count=1)
          if n != 1:
              raise SystemExit(f"Could not find onCreate(savedInstanceState) in {p}; no source changed.")
          p.write_text(updated, encoding="utf-8")
          print(f"Enabled edge-to-edge status bar/cutout layout in {p}")
          PY

      - name: Apply adaptive accessible phone layout to all screens
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          layout_dir = Path("app/src/main/res/layout")
          if not layout_dir.exists():
              raise SystemExit("Layout directory not found.")

          for p in layout_dir.glob("*.xml"):
              s = p.read_text(encoding="utf-8")
              original = s

              # 1. إضافة fitsSystemWindows="true" للعنصر الجذري في جميع الشاشات لمنع تداخل المحتوى مع أشرطة النظام
              root_match = re.search(r'(<[a-zA-Z0-9.]+\b[^>]*)>', s)
              if root_match:
                  root_tag = root_match.group(1)
                  if 'android:fitsSystemWindows' not in root_tag:
                      new_root_tag = root_tag + ' android:fitsSystemWindows="true"'
                      s = s.replace(root_tag, new_root_tag, 1)

              # 2. تعديلات خاصة بالشاشة الرئيسية فقط (activity_main.xml)
              if p.name == "activity_main.xml" and "GHOSTS_ADAPTIVE_PHONE_LAYOUT_APPLIED" not in s:
                  def compact_large_dp(m):
                      value = float(m.group(1))
                      if value < 40:
                          return m.group(0)
                      return f'{max(32, round(value * 0.88))}dp'

                  s = re.sub(r'(?<![A-Za-z0-9_.-])(\d+(?:\.\d+)?)dp\b', compact_large_dp, s)

                  pattern = re.compile(r'<[A-Za-z][^>]*@\+id/connectButton[^>]*>', re.DOTALL)
                  match = pattern.search(s)
                  if not match:
                      raise SystemExit("Could not find connectButton in activity_main.xml")
                  tag = match.group(0)
                  tag = re.sub(r'android:layout_width="[^"]+"', 'android:layout_width="116dp"', tag, count=1)
                  tag = re.sub(r'android:layout_height="[^"]+"', 'android:layout_height="116dp"', tag, count=1)
                  s = s[:match.start()] + tag + s[match.end():]

                  clickable = re.compile(r'<([A-Za-z][\w.]*)\b([^>]*android:(?:clickable|onClick)="[^"]+"[^>]*)>', re.DOTALL)
                  def accessible_target(m):
                      tag_name, attrs = m.group(1), m.group(2)
                      self_closing = attrs.rstrip().endswith("/")
                      if self_closing:
                          attrs = attrs.rstrip()[:-1].rstrip()
                      if 'android:minHeight=' not in attrs:
                          attrs += ' android:minHeight="48dp"'
                      if 'android:minWidth=' not in attrs and tag_name.split('.')[-1] in {
                          'ImageButton', 'Button', 'MaterialButton'
                      }:
                          attrs += ' android:minWidth="48dp"'
                      return f'<{tag_name}{attrs}{" /" if self_closing else ""}>'
                  s = clickable.sub(accessible_target, s)

                  title_pattern = re.compile(r'<([A-Za-z][\w.]*)\b([^>]*(?:Android_Ghosts[.]DNSTT|Android_Ghosts)[^>]*)>', re.DOTALL)
                  def readable_title(m):
                      tag_name, attrs = m.group(1), m.group(2)
                      self_closing = attrs.rstrip().endswith("/")
                      if self_closing:
                          attrs = attrs.rstrip()[:-1].rstrip()
                      if 'android:textSize=' in attrs:
                          attrs = re.sub(r'android:textSize="[^"]+"', 'android:textSize="18sp"', attrs, count=1)
                      else:
                          attrs += ' android:textSize="18sp"'
                      if 'android:maxLines=' not in attrs:
                          attrs += ' android:maxLines="1"'
                      if 'android:ellipsize=' not in attrs:
                          attrs += ' android:ellipsize="end"'
                      return f'<{tag_name}{attrs}{" /" if self_closing else ""}>'
                  s = title_pattern.sub(readable_title, s)

                  required = ("@+id/toolbar", "@+id/telegramLink", "@+id/connectButton",
                              "@+id/connectText", "@+id/statusText", "@+id/profileText",
                              "@+id/statsGrid", "@+id/trafficChart", "@+id/chartSummary",
                              "@+id/chartWindowButton", "@+id/profileList", "@+id/testButton",
                              "@+id/fab", "@+id/emptyText")
                  missing = [view_id for view_id in required if view_id not in s]
                  if missing:
                      raise SystemExit("Missing required Activity view IDs: " + ", ".join(missing))

              if s != original:
                  p.write_text(s, encoding="utf-8")
                  print(f"Updated layout file: {p.name}")

          print("Successfully applied fitsSystemWindows to all layout screens and adaptive layout to main activity.")
          PY

      - name: Build and stage ARM64 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./build-debug-apk.sh

      - name: Verify APK artifact
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="dist/DNSTT-Ghosts-arm64-v8a-debug.apk"
          test -s "$APK"
          echo "APK ready: $APK"
          ls -lh "$APK"
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | grep -E '^(package:|native-code:)'
          fi

      - name: Upload APK only (source ZIP is a separate file)
        uses: actions/upload-artifact@v4
        with:
          name: DNSTT-Ghosts-arm64-v8a-APK
          path: ${{ env.PROJECT_DIR }}/dist/DNSTT-Ghosts-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
